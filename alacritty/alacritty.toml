[cursor]
blink_interval = 500
unfocused_hollow = true

[cursor.style]
blinking = "Always"
shape = "Beam"

[env]
TERM = "xterm-256color"

[font.bold]
family = "Noto Sans Mono"

[font.italic]
family = "Noto Sans Mono"

[font.normal]
family = "Noto Sans Mono"

[mouse]
hide_when_typing = false

[selection]
save_to_clipboard = true

[general]
# The theme path is relative to this file, so it resolves on any machine regardless of the home
# directory layout (`/home/connor` versus `/Users/connor`). The `alacritty.local.toml` import is
# last, so the machine-specific `font.size` and `terminal.shell` it defines take precedence. That
# file is gitignored and created once per machine from `alacritty.local.toml.example`.
import = [
    "alacritty-theme/themes/tokyo_night_enhanced.toml",
    "alacritty.local.toml",
]
# import = ["alacritty-theme/themes/github_light.toml"]
