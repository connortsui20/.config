[cursor]
blink_interval = 500
unfocused_hollow = true

[cursor.style]
blinking = "Always"
shape = "Beam"

[env]
TERM = "xterm-256color"

[font.bold]
family = "Noto Sans Mono"

[font.italic]
family = "Noto Sans Mono"

[font.normal]
family = "Noto Sans Mono"

[mouse]
hide_when_typing = false

[selection]
save_to_clipboard = true

[general]
# The first theme is the portable fallback. On KDE, `update-theme` copies the light or dark variant
# to `active-theme.toml`; the systemd user units rerun it when Plasma changes `kdeglobals`. The file
# is machine-local and a missing import is skipped silently, so macOS keeps the dark fallback.
#
# `alacritty.local.toml` holds the machine-specific `font.size` and `terminal.shell`. It is
# gitignored and created once per machine from `alacritty.local.toml.example`; a missing import is
# skipped silently, so a machine without it falls back to the login shell instead of fish + zellij.
#
# Note that alacritty loads the *importing* file last, so any key set below overrides every import,
# including `alacritty.local.toml`. Anything that needs a per-machine value must therefore be absent
# from this file entirely rather than merely defaulted here.
import = [
    "alacritty-theme/themes/tokyo_night_enhanced.toml",
    "active-theme.toml",
    "alacritty.local.toml",
]
